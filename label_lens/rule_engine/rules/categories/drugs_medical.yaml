product_type: drugs_medical
description: Drugs and medical devices – primarily governed by Drugs & Cosmetics Act / Medical Device Rules. LMPC applies to a limited extent.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer"
  generic_name:
    severity: high
    label: "Name of the Drug / Device"
  net_quantity:
    severity: medium
    label: "Net Quantity / Pack size"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes) – where applicable"

exempted:
  - unit_sale_price
  - best_before          # Expiry date is governed by D&C / MDR

notes:
  - Most labelling is controlled by Drugs & Cosmetics Rules / Medical Device Rules.
  - LMPC MRP declaration may still be required depending on the product.