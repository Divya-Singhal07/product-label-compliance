product_type: seeds
description: Seeds labelled and certified under the Seeds Act, 1966.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address"
  generic_name:
    severity: high
    label: "Kind / Variety of Seed"
  net_quantity:
    severity: high
    label: "Net Quantity"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"

exempted:
  - mfg_date            # Exempt if labelled & certified under Seeds Act

notes:
  - Month and year of packing is generally handled under Seeds Act requirements.