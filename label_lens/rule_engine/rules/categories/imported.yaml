product_type: imported
description: Additional requirements for imported packaged commodities.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Importer"
  country_of_origin:
    severity: high
    label: "Country of Origin / Manufacture / Assembly"
  generic_name:
    severity: high
    label: "Common or Generic Name"
  net_quantity:
    severity: high
    label: "Net Quantity"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"
  consumer_care:
    severity: high
    label: "Consumer Care Details"

exempted: []

custom_checks:
  - rule_id: IMP_001
    field: country_of_origin
    must_exist: true
    severity: high
    message: "Country of Origin is mandatory for all imported packages"
    suggestion: "Declare clearly as 'Country of Origin: XXX' or 'Made in XXX'"

notes:
  - Importer name & address is mandatory.
  - Country of origin must be declared.