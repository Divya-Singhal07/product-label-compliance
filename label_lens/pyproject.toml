[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-lens"
version = "0.1.0"
description = "Label Lens OCR pipeline"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["label_lens*"]
