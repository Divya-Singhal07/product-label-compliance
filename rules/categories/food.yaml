product_type: food
description: Rules for food products. Many declarations follow FSSAI (Food Safety and Standards Act) in addition to / instead of pure LMPC.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Packer / Importer (or as per FSSAI)"
  generic_name:
    severity: high
    label: "Name of the Food"
  net_quantity:
    severity: high
    label: "Net Quantity"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"
  consumer_care:
    severity: high
    label: "Consumer Care Details"
  best_before:
    severity: high
    label: "Best Before / Use By Date"

exempted:
  - mfg_date          # FSSAI has its own date marking rules

notes:
  - Prefer FSSAI labelling requirements for date marking, vegetarian/non-vegetarian logo, ingredients, nutritional information etc.
  - LMPC still applies for MRP, net quantity, manufacturer details and consumer care.
  - Unit Sale Price is generally required.