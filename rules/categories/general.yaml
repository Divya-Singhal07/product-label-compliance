product_type: general
description: Default rules for standard retail packaged commodities under Legal Metrology (Packaged Commodities) Rules, 2011

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Packer / Importer"
  generic_name:
    severity: high
    label: "Common or Generic Name of the Commodity"
  net_quantity:
    severity: high
    label: "Net Quantity"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"
  consumer_care:
    severity: high
    label: "Consumer Care Details (including email)"

exempted: []

notes:
  - Unit Sale Price is required unless the package is a combination / multi-piece package or MRP equals unit price.
  - Month & Year of manufacture is required except for food, cosmetics and seeds (different laws apply).
  - Best Before / Use By is required only when the commodity may become unfit for consumption.