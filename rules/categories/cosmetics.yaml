product_type: cosmetics
description: Cosmetics follow Drugs & Cosmetics Rules, 1945 for several declarations in addition to LMPC.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Packer"
  generic_name:
    severity: high
    label: "Name of the Cosmetic Product"
  net_quantity:
    severity: high
    label: "Net Quantity"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"
  consumer_care:
    severity: high
    label: "Consumer Care Details"

exempted:
  - mfg_date          # Controlled by Drugs & Cosmetics Rules

notes:
  - Batch number, manufacturing licence number and other D&C specific declarations are outside pure LMPC scope.
  - Best Before may still be required depending on product stability.