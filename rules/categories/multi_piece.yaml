product_type: multi_piece
description: Multi-piece, combination and group packages.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Packer / Importer"
  generic_name:
    severity: high
    label: "Identity of commodity + number of retail packages / pieces"
  net_quantity:
    severity: high
    label: "Total net quantity or number of retail packages"
  mrp:
    severity: high
    label: "Maximum Retail Price of the multi-piece package (inclusive of all taxes)"

exempted:
  - unit_sale_price     # Explicitly not required for multi-piece / combination / group packages

notes:
  - Individual retail packages inside must still comply with full retail declaration rules.
  - Outer package needs fewer declarations.
  - Unit Sale Price is not required on the outer multi-piece package.