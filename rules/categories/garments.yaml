product_type: garments
description: Partial exemption for garment / hosiery items sold loose or open (where consumer can inspect before buying).

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Brand Owner / Importer"
  country_of_origin:
    severity: high
    label: "Country of Origin (for imported garments)"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"
  consumer_care:
    severity: medium
    label: "Consumer Care number / email"

exempted:
  - generic_name
  - net_quantity
  - unit_sale_price
  - mfg_date
  - best_before

notes:
  - Exemption applies only when sold loose/open and consumer can inspect the item.
  - Size indicator (S, M, L, XL etc.) should be present.
  - Full rules apply if the garment is sold in a sealed package.