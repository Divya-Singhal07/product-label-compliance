product_type: ecommerce
description: Declarations required on digital / electronic network (e-commerce listings).

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Packer / Importer"
  generic_name:
    severity: high
    label: "Common or Generic Name"
  net_quantity:
    severity: high
    label: "Net Quantity"
  mrp:
    severity: high
    label: "Maximum Retail Price (inclusive of all taxes)"
  consumer_care:
    severity: high
    label: "Consumer Care Details"
  country_of_origin:
    severity: high
    label: "Country of Origin (if imported)"

exempted:
  - mfg_date            # Month & year of manufacture/packing is NOT required on e-commerce
  - unit_sale_price     # Generally not required on e-commerce platforms

notes:
  - Rule 6(10): E-commerce entity must display all mandatory declarations except month and year of manufacture/packing.
  - Best Before / Use By should still be shown when applicable.