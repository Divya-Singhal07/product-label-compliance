product_type: wholesale
description: Declarations required on wholesale packages.

mandatory:
  manufacturer:
    severity: high
    label: "Name and Address of Manufacturer / Packer / Importer"
  generic_name:
    severity: high
    label: "Identity of the commodity"
  net_quantity:
    severity: high
    label: "Total number of retail packages OR net quantity"

exempted:
  - mrp
  - unit_sale_price
  - consumer_care
  - best_before
  - mfg_date

notes:
  - Wholesale packages have a lighter set of declarations.
  - MRP is not required on the wholesale package itself (it is required on the retail packages inside).